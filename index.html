<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Estimasi Pengiriman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-5xl bg-white p-6 md:p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-4">Cek Estimasi Maksimal Kiriman</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <form id="estimasiForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">1. TANGGAL KIRIMAN</label>
                    <input type="text" id="tanggal" placeholder="Contoh: 03/08/2026" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">2. JENIS MARKETPLACE</label>
                    <input type="text" id="marketplace" placeholder="Contoh: SHOPEE atau TOKOPEDIA" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">3. ORIGIN</label>
                    <input type="text" id="origin" placeholder="Contoh: BKI10000 atau CGK10000" class="w-full px-4 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">4. DESTINATION</label>
                    <input type="text" id="destination" placeholder="Contoh: UPG21817 atau AMI10011" class="w-full px-4 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">5. JENIS SERVICE</label>
                    <input type="text" id="service" placeholder="Contoh: REG, JTR, YES, YES*" class="w-full px-4 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" id="searchButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-2">
                    SEARCH
                </button>
            </form>

            <div class="flex flex-col justify-center">
                <div class="p-8 bg-blue-50 rounded-xl border-2 border-blue-200 h-full flex flex-col items-center justify-center text-center shadow-inner min-h-[250px]">
                    <label class="block text-lg font-bold text-blue-900 mb-4 tracking-wide">ESTIMASI MAKSIMAL KIRIMAN</label>
                    <div id="hasil" class="text-3xl md:text-4xl font-extrabold text-blue-700">...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const hariLiburNasional = [
            "2026-01-01", "2026-01-16", "2026-02-16", "2026-02-17", 
            "2026-03-18", "2026-03-19", "2026-03-20", "2026-03-21", 
            "2026-03-23", "2026-03-24", "2026-04-03", "2026-05-01", 
            "2026-05-14", "2026-05-15", "2026-05-27", "2026-05-28", 
            "2026-06-01", "2026-06-16", "2026-08-17", "2026-08-25", 
            "2026-12-24", "2026-12-25"
        ];
        
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jum'at", "Sabtu"];

        function formatTanggalHasil(dateObj, isYes = false) {
            let dd = String(dateObj.getDate()).padStart(2, '0');
            let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let yy = String(dateObj.getFullYear()).slice(-2);
            let hari = namaHari[dateObj.getDay()];
            
            let hasilTanggal = `${dd}/${mm}/${yy}`;
            if (isYes) hasilTanggal += " jam 23.59";
            
            return `${hari} ${hasilTanggal}`;
        }

        function tambahHariKalender(tanggalMulai, jumlahHari) {
            let result = new Date(tanggalMulai);
            result.setDate(result.getDate() + jumlahHari);
            return result;
        }

        function tambahHariKerja(tanggalMulai, jumlahHari) {
            let result = new Date(tanggalMulai);
            let hariDitambah = 0;
            while (hariDitambah < jumlahHari) {
                result.setDate(result.getDate() + 1);
                let dayOfWeek = result.getDay();
                let yyyy = result.getFullYear();
                let mm = String(result.getMonth() + 1).padStart(2, '0');
                let dd = String(result.getDate()).padStart(2, '0');
                let dateStr = `${yyyy}-${mm}-${dd}`;
                
                if (dayOfWeek !== 0 && !hariLiburNasional.includes(dateStr)) {
                    hariDitambah++;
                }
            }
            return result;
        }

        // Mesin Penerjemah Otomatis (Tokgistic/Tokopedia)
        function translateCityName(city) {
            let parts = city.trim().split(/\s+/);
            let direction = "";
            let hasKota = false;
            let baseName = [];
            let isKepulauan = false;
            let isPulau = false;
            let isPegunungan = false;

            // Daftar Pasti Kota (Inclusion List) yang menggunakan kata "City"
            const cityWithCityList = [
                "bandung", "tangerang", "bekasi", "semarang", "malang", "bogor", 
                "tasikmalaya", "cirebon", "pekalongan", "serang", "sukabumi", 
                "kediri", "magelang", "tegal", "madiun", "pasuruan", "blitar", 
                "mojokerto", "banjar", "probolinggo", "sorong", "jayapura", 
                "kupang", "bima", "gorontalo", "solok"
            ];

            for (let i = 0; i < parts.length; i++) {
                let w = parts[i].toLowerCase();
                
                if (w === "selatan") direction = "South";
                else if (w === "barat") {
                    if (i + 1 < parts.length && parts[i+1].toLowerCase() === "daya") {
                        direction = "Southwest";
                        i++; // Melewati kata 'daya'
                    } else {
                        direction = "West";
                    }
                }
                else if (w === "southwest") direction = "Southwest";
                else if (w === "timur") direction = "East";
                else if (w === "utara") direction = "North";
                
                // LOGIKA BARU: Penanganan Arah Ganda (Tengah Utara & Tengah Selatan)
                else if (w === "tengah") {
                    if (i + 1 < parts.length && parts[i+1].toLowerCase() === "utara") {
                        direction = "North Central";
                        i++; // Melewati kata 'utara'
                    } else if (i + 1 < parts.length && parts[i+1].toLowerCase() === "selatan") {
                        direction = "South Central";
                        i++; // Melewati kata 'selatan'
                    } else {
                        direction = "Central";
                    }
                }
                
                else if (w === "pusat" || w === "central") direction = "Central";
                else if (w === "tenggara" || w === "southeast") direction = "Southeast";
                else if (w === "kota" || w === "city") hasKota = true;
                else if (w === "kabupaten" || w === "kab" || w === "kab.") {
                    // Abaikan tulisan kabupaten
                }
                else if (w === "kepulauan" || w === "islands") isKepulauan = true;
                else if (w === "pulau" || w === "island") isPulau = true;
                else if (w === "pegunungan" || w === "mountains") isPegunungan = true;
                else {
                    baseName.push(parts[i].charAt(0).toUpperCase() + parts[i].slice(1).toLowerCase());
                }
            }

            let baseNameStr = baseName.join(" ");
            let finalName = baseNameStr;

            // Memasukkan unsur geografis di belakang nama
            if (isKepulauan) finalName = finalName + " Islands";
            if (isPulau) finalName = finalName + " Island";
            if (isPegunungan) finalName = finalName + " Mountains";

            // Memasukkan unsur arah di depan nama
            if (direction !== "") finalName = direction + " " + finalName;

            // City Inclusion Logic: Cek apakah baseName ada di daftar pengecualian 26 kota
            if (hasKota) {
                if (cityWithCityList.includes(baseNameStr.toLowerCase())) {
                    finalName = finalName + " City";
                }
            }
            
            // Bypass Typo dari Database untuk Maluku Tenggara
            if (finalName.toLowerCase() === "southeast maluku") {
                finalName = "Sotheast Maluku";
            }

            return finalName.trim();
        }

        let dataCSVCache = {};

        function preLoadCSV() {
            // Ditambahkan file zona.csv ke dalam antrian load
            const filesToLoad = [
                "reg_shopee_1.csv", "reg_shopee_2.csv", "reg_shopee_3.csv", "jtr_shopee.csv",
                "reg_tokopedia.csv", "jtr_tokopedia.csv", "zona.csv"
            ];
            
            filesToLoad.forEach(file => {
                let isZona = (file === "zona.csv");
                Papa.parse(file, {
                    download: true,
                    header: !isZona, // Khusus zona.csv dibaca tanpa header agar kebal dari judul berantakan
                    complete: function(results) {
                        dataCSVCache[file] = results.data;
                        console.log(`${file} berhasil dimuat ke cache. Total baris: ${results.data.length}`);
                    },
                    error: function(err) {
                        console.error(`Gagal memuat ${file}`, err);
                    }
                });
            });
        }

        window.onload = preLoadCSV;

        // Mesin pencari data dari Sheet ZONA (Metode Tembak Koordinat Kolom Hasil Revisi)
        function cariDiZona(kode) {
            let data = dataCSVCache["zona.csv"];
            if (!data) return null;
            
            kode = kode.trim().toUpperCase();
            
            // Mulai dari indeks i = 2 untuk melewati Baris 1 (Judul) dan Baris 2 (Header)
            for (let i = 2; i < data.length; i++) {
                let row = data[i];
                if (!row) continue;
                
                // Menembak langsung ke posisi abjad kolom (Koordinat Baru karena Kolom A kosong dihapus sistem CSV)
                let acuan = (row[1] || "").trim().toUpperCase(); // Posisi 1 = Kolom CODING ACUAN
                let dest = (row[2] || "").trim().toUpperCase();  // Posisi 2 = Kolom DEST
                
                if (acuan === kode || dest === kode) {
                    let kabKota = (row[6] || "").trim();         // Posisi 6 = Kolom KABUPATEN / KOTA
                    let namaDaerah = (row[7] || "").trim();      // Posisi 7 = Kolom NAMA KAB/KOTA
                    return `${kabKota} ${namaDaerah}`.trim();
                }
            }
            return null;
        }

        function cariSlaDiCache(fileNames, service, origin, destination) {
            let slaDitemukan = null;
            let kunciCari = (service + origin + destination).trim().toUpperCase();
            let searchOrigin = origin.trim().toUpperCase();
            let searchDest = destination.trim().toUpperCase();

            for (let f = 0; f < fileNames.length; f++) {
                let currentFile = fileNames[f];
                let data = dataCSVCache[currentFile];
                
                if (!data) continue; 

                for (let i = 0; i < data.length; i++) {
                    let row = data[i];
                    let isMatch = false;
                    
                    let kunciCsvGabung = (row['SHOPEE REG'] || "").trim().toUpperCase();
                    let csvService = (row['SERVICE'] || row['id_type'] || "").trim().toUpperCase();
                    let csvOrigin = (row['ORIGIN'] || row['shipment_city_name'] || "").trim().toUpperCase();
                    let csvDest = (row['DESTINATION'] || row['recipient_city_name'] || "").trim().toUpperCase();

                    if (kunciCsvGabung !== "" && kunciCsvGabung === kunciCari) {
                        isMatch = true;
                    } else if (csvOrigin === searchOrigin && csvDest === searchDest) {
                        if (csvService === "" || csvService === service) {
                            isMatch = true;
                        }
                    }

                    if (isMatch) {
                        let valSla = row['SLA'] || row['Target SLA'];
                        if (valSla !== undefined && valSla !== null) {
                            slaDitemukan = parseInt(valSla);
                        }
                        break;
                    }
                }
                
                if (slaDitemukan !== null) break; 
            }
            return slaDitemukan;
        }

        function hitungEstimasi() {
            try {
                let rawTanggal = document.getElementById('tanggal').value;
                let dateMatch = rawTanggal.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (!dateMatch) {
                    alert("Harap masukkan tanggal dengan format DD/MM/YYYY yang benar.");
                    return;
                }
                
                let dateObj = new Date(`${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`);

                let marketplace = document.getElementById('marketplace').value.trim().toUpperCase();
                let origin = document.getElementById('origin').value.trim();
                let destination = document.getElementById('destination').value.trim();
                let serviceRaw = document.getElementById('service').value.trim().toUpperCase();

                let isTokgisticOrTokopedia = marketplace.includes("TOKGISTIC") || marketplace.includes("TOKOPEDIA") || marketplace.includes("TIKTOK");

                let service = "";
                if (serviceRaw.includes("YES*")) service = "YES*";
                else if (serviceRaw.includes("YES")) service = "YES";
                else if (serviceRaw.includes("CTC")) service = "REG"; 
                else if (serviceRaw.includes("REG")) service = "REG";
                else if (serviceRaw.includes("JTR")) service = "JTR";

                let isOriginDestRequired = true;
                let isMarketplaceAngka = !isNaN(marketplace) && marketplace !== "";

                if (isMarketplaceAngka && (service === "REG" || service === "JTR")) {
                    isOriginDestRequired = false;
                } else if (service === "YES" || service === "YES*") {
                    isOriginDestRequired = false;
                }

                // Validasi Regex kembali diaktifkan wajib untuk SEMUA marketplace
                if (isOriginDestRequired) {
                    const regexKode = /^[A-Z]{3}\d+$/; 
                    if (!regexKode.test(origin.toUpperCase())) {
                        alert("Origin: harap input dengan benar (3 Huruf + minimal 5 Angka)");
                        return;
                    }
                    if (!regexKode.test(destination.toUpperCase())) {
                        alert("Destination: harap input dengan benar (3 Huruf + minimal 5 Angka)");
                        return;
                    }
                }

                let estimasiDate = null;
                let finalSla = null;

                if (service === "YES") {
                    estimasiDate = tambahHariKalender(dateObj, 1);
                } 
                else if (service === "YES*") {
                    estimasiDate = tambahHariKalender(dateObj, 2);
                }
                else if (isMarketplaceAngka && service === "REG") {
                    finalSla = parseInt(marketplace);
                    estimasiDate = tambahHariKerja(dateObj, finalSla);
                }
                else if (isMarketplaceAngka && service === "JTR") {
                    finalSla = parseInt(marketplace);
                    estimasiDate = tambahHariKalender(dateObj, finalSla);
                }
                else {
                    let fileAntrean = [];
                    if (marketplace === "SHOPEE" && service === "REG") {
                        fileAntrean = ["reg_shopee_1.csv", "reg_shopee_2.csv", "reg_shopee_3.csv"]; 
                    } else if (marketplace === "SHOPEE" && service === "JTR") {
                        fileAntrean = ["jtr_shopee.csv"];
                    } else if (isTokgisticOrTokopedia && service === "REG") {
                        fileAntrean = ["reg_tokopedia.csv"]; 
                    } else if (isTokgisticOrTokopedia && service === "JTR") {
                        fileAntrean = ["jtr_tokopedia.csv"]; 
                    } else {
                        fileAntrean = ["data_default.csv"]; 
                    }

                    let searchDest = destination.trim().toUpperCase();
                    let searchOrigins = [origin.trim().toUpperCase()];

                    // LOGIKA BARU PENCARIAN ZONA & TRANSLATOR
                    if (isTokgisticOrTokopedia) {
                        
                        // 1. Proses Destination Wajib Lewat ZONA
                        let zonaDest = cariDiZona(destination);
                        if (!zonaDest) {
                            document.getElementById('hasil').innerHTML = `<span class="text-red-500 text-lg">Destination tidak ditemukan di Zona</span>`;
                            return;
                        }
                        searchDest = translateCityName(zonaDest);

                        // 2. Proses Origin (Bypass ZONA khusus CGK10000)
                        if (origin.trim().toUpperCase() === "CGK10000") {
                            searchOrigins = ["West Jakarta", "East Jakarta", "South Jakarta", "North Jakarta", "Central Jakarta"];
                        } else {
                            let zonaOrigin = cariDiZona(origin);
                            if (!zonaOrigin) {
                                document.getElementById('hasil').innerHTML = `<span class="text-red-500 text-lg">Origin tidak ditemukan di Zona</span>`;
                                return;
                            }
                            searchOrigins = [translateCityName(zonaOrigin)];
                        }
                    }

                    // TAHAP PENCARIAN SAPU JAGAT (Mengambil Nilai Maksimal / Terlama)
                    let maxSla = -1;
                    let isSlaFound = false;

                    for (let i = 0; i < searchOrigins.length; i++) {
                        let currentSearchOrigin = searchOrigins[i];
                        let slaDitemukan = cariSlaDiCache(fileAntrean, service, currentSearchOrigin, searchDest);
                        
                        if (slaDitemukan !== null) {
                            isSlaFound = true;
                            if (slaDitemukan > maxSla) {
                                maxSla = slaDitemukan;
                            }
                        }
                    }

                    if (isSlaFound) {
                        finalSla = maxSla;
                        estimasiDate = tambahHariKalender(dateObj, finalSla);
                    } else {
                        document.getElementById('hasil').innerHTML = `<span class="text-red-500 text-lg">SLA tidak ditemukan</span>`;
                        return;
                    }
                }

                let htmlOutput = "";

                if ((marketplace === "SHOPEE" || isTokgisticOrTokopedia) && (service === "REG" || service === "JTR") && finalSla !== null) {
                    htmlOutput += `<div class="mb-2">(${finalSla} hari)</div>`;
                }

                let isYes = (service === "YES" || service === "YES*");
                htmlOutput += `<div>${formatTanggalHasil(estimasiDate, isYes)}</div>`;

                let today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let checkDate = new Date(estimasiDate);
                checkDate.setHours(0, 0, 0, 0);
                
                if (checkDate < today) {
                    htmlOutput += `<div class="mt-2 text-red-600 text-lg font-bold">- Lewat estimasi dan open tiket -</div>`;
                }

                document.getElementById('hasil').innerHTML = htmlOutput;

            } catch (error) {
                alert("Terjadi kesalahan pada sistem: " + error.message);
                console.error(error);
                document.getElementById('hasil').innerHTML = "Error";
            }
        }

        document.getElementById('estimasiForm').addEventListener('submit', function(event) {
            event.preventDefault();
            hitungEstimasi();
        });

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'BUTTON') {
                    event.preventDefault();
                    document.getElementById('searchButton').click();
                }
            }
        });

    </script>
</body>
</html>
